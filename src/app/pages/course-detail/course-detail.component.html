<section class="course-detail-layout">
    @if (loading()) {
        <app-loading-progress heading="Đang tải môn học..." backdropFilter="none"></app-loading-progress>
    }

    <header class="course-detail-header">
        <div class="course-detail-header__main">
            <button type="button" mat-flat-button class="btn ictu-badge-btn--secondary-reverse course-detail-back-btn" (click)="backToList()">
                <i class="fa fa-arrow-left" aria-hidden="true"></i>
                <span>Danh sách môn học</span>
            </button>
            <h2 class="course-detail-heading mb-0">{{ courseTitle() }}</h2>
        </div>

        <nav class="course-detail-tabs" aria-label="Các chức năng môn học" role="tablist">
            @for (tab of tabs; track tab.key) {
                <button
                    type="button"
                    class="course-detail-tab"
                    role="tab"
                    [attr.aria-selected]="activeTab() === tab.key"
                    [class.is-active]="activeTab() === tab.key"
                    (click)="selectTab(tab)">
                    <i class="fa" [ngClass]="tab.icon" aria-hidden="true"></i>
                    <span>{{ tab.label }}</span>
                </button>
            }
        </nav>
    </header>

    <main class="course-detail-content">
        <router-outlet></router-outlet>
    </main>
</section>
