<section class="course-detail-layout">
    @if (loading()) {
        <app-loading-progress heading="Đang tải môn học..." backdropFilter="none"></app-loading-progress>
    }

    <header class="course-detail-header">
        <div class="course-detail-header__main">
            <button
                type="button"
                mat-flat-button
                class="btn ictu-badge-btn--secondary-reverse course-detail-back-btn"
                aria-label="Trở lại danh sách môn học"
                (click)="backToList()">
                <i class="fa fa-arrow-left" aria-hidden="true"></i>
            </button>
            <span class="course-detail-header__divider" aria-hidden="true"></span>
            <h2 class="course-detail-heading mb-0">{{ courseTitle() }}</h2>

            <nav class="course-detail-tabs" aria-label="Các chức năng môn học" role="tablist">
                @for (tab of tabs; track tab.key) {
                    <button
                        type="button"
                        class="course-detail-tab"
                        role="tab"
                        [attr.aria-selected]="activeTab() === tab.key"
                        [class.is-active]="activeTab() === tab.key"
                        (click)="selectTab(tab.key)">
                        <span>{{ tab.label }}</span>
                    </button>
                }
            </nav>
        </div>
    </header>

    <main class="course-detail-content">
        @switch (activeTab()) {
            @case ('info') {
                <app-monhoc-thongtin [course]="course()" [courseId]="courseId()"></app-monhoc-thongtin>
            }
            @case ('outcomes') {
                <app-monhoc-muctieu-cdr [course]="course()" [courseId]="courseId()"></app-monhoc-muctieu-cdr>
            }
            @case ('content') {
                <app-course-content [course]="course()" [courseId]="courseId()"></app-course-content>
            }
            @case ('questions') {
                <app-course-questions [course]="course()" [courseId]="courseId()"></app-course-questions>
            }
            @case ('assessment') {
                <app-course-assessment [course]="course()" [courseId]="courseId()"></app-course-assessment>
            }
            @case ('exam-form') {
                <app-course-exam-form [course]="course()" [courseId]="courseId()"></app-course-exam-form>
            }
            @case ('settings') {
                <app-course-settings [course]="course()" [courseId]="courseId()"></app-course-settings>
            }
        }
    </main>
</section>
